// LIGHT/DARK THEME TOGGLE
// ══════════════════════════════════════════════════════════════════════

function applyTheme(theme) {
  const root = document.documentElement;
  const btn = document.getElementById('theme-btn');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (theme === 'light') {
    root.classList.add('light');
    if (btn) btn.innerHTML = '&#9728;'; // sun
    if (meta) meta.content = '#f5f5f7';
  } else {
    root.classList.remove('light');
    if (btn) btn.innerHTML = '&#9790;'; // moon
    if (meta) meta.content = '#0f1117';
  }
  localStorage.setItem('food-theme', theme);
}

function toggleTheme() {
  const current = document.documentElement.classList.contains('light') ? 'light' : 'dark';
  applyTheme(current === 'light' ? 'dark' : 'light');
  // Redraw charts since colors depend on CSS vars
  setTimeout(() => { drawCharts(); }, 50);
}

// Apply saved theme on load
(function() {
  const saved = localStorage.getItem('food-theme');
  if (saved) applyTheme(saved);
})();

// ══════════════════════════════════════════════════════════════════════
// AUTO-FETCH STOCK PRICES (Yahoo Finance via CORS proxy)
// ══════════════════════════════════════════════════════════════════════

const TICKER_YAHOO_MAP = {
  'SKFB': 'SKF-B.ST',
  'IFX': 'IFX.DE',
  'SHA0': 'SHA.DE',
  'K3R': 'KGX.DE',
  'URNU': 'URNU.L',
  // SSM1 has no good Yahoo mapping, skip
};

// Tickers to skip (no reliable Yahoo mapping)
const TICKER_SKIP = new Set(['SSM1']);

function getYahooTicker(ticker) {
  const t = ticker.trim().toUpperCase();
  if (TICKER_SKIP.has(t)) return null;
  if (TICKER_YAHOO_MAP[t]) return TICKER_YAHOO_MAP[t];
  return t;
}

const PRICE_PROXY = 'https://food-prices.rivegabur.workers.dev';

async function fetchTickerPrice(ticker) {
  const yahooTicker = getYahooTicker(ticker);
  if (!yahooTicker) return null;
  const url = `${PRICE_PROXY}/?t=${encodeURIComponent(yahooTicker)}`;
  const resp = await fetch(url, { signal: AbortSignal.timeout(10000) });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  if (data.error) throw new Error(data.error);
  return data.price || null;
}

async function refreshAllPrices() {
  const btn = document.getElementById('btn-refresh-prices');
  if (btn) { btn.classList.add('loading'); }

  const tickerRows = rows.filter(r => r.ticker && r.ticker.trim());
  let updated = 0;

  const promises = tickerRows.map(async (row) => {
    try {
      const price = await fetchTickerPrice(row.ticker);
      if (price !== null && price > 0) {
        row.price = price;
        updated++;
      }
    } catch (e) {
      console.warn(`Failed to fetch ${row.ticker}:`, e.message);
    }
  });

  await Promise.all(promises);

  if (btn) { btn.classList.remove('loading'); }

  if (updated > 0) {
    render();
    schedSave();
    showSaveIndicator(`${updated} precio${updated > 1 ? 's' : ''} actualizado${updated > 1 ? 's' : ''} ✓`);
  } else {
    showSaveIndicator('No se pudieron actualizar precios');
  }
}

// ══════════════════════════════════════════════════════════════════════
// P&L TRACKING
// ══════════════════════════════════════════════════════════════════════

function getRowPnl(row) {
  const price = parseFloat(row.price) || 0;
  const avgPrice = parseFloat(row.avgPrice) || 0;
  const titulos = parseFloat(row.titulos) || 0;
  if (avgPrice <= 0 || price <= 0 || titulos <= 0) return null;
  const pnl = (price - avgPrice) * titulos;
  const pnlPct = (price / avgPrice - 1) * 100;
  return { pnl, pnlPct };
}

function formatPnl(pnlData) {
  if (!pnlData) return '';
  const { pnl, pnlPct } = pnlData;
  const sign = pnl >= 0 ? '+' : '';
  const cls = pnl >= 0 ? 'pnl-positive' : 'pnl-negative';
  return `<span class="${cls}">${sign}${fmt(pnl)} € (${sign}${pnlPct.toFixed(1)}%)</span>`;
}

function getTotalPnl() {
  let totalPnl = 0;
  let totalCost = 0;
  let hasPnl = false;
  rows.forEach(r => {
    const pnlData = getRowPnl(r);
    if (pnlData) {
      totalPnl += pnlData.pnl;
      totalCost += (parseFloat(r.avgPrice) || 0) * (parseFloat(r.titulos) || 0);
      hasPnl = true;
    }
  });
  if (!hasPnl) return null;
  const totalPnlPct = totalCost > 0 ? (totalPnl / totalCost * 100) : 0;
  return { pnl: totalPnl, pnlPct: totalPnlPct };
}

// ══════════════════════════════════════════════════════════════════════
// PULL-TO-REFRESH
// ══════════════════════════════════════════════════════════════════════

(function() {
  let startY = 0;
  let pulling = false;
  const threshold = 60;

  document.addEventListener('touchstart', function(e) {
    if (window.scrollY === 0) {
      startY = e.touches[0].clientY;
      pulling = true;
    }
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!pulling) return;
    const diff = e.touches[0].clientY - startY;
    const indicator = document.getElementById('ptr-indicator');
    if (diff > 10 && window.scrollY === 0 && indicator) {
      const h = Math.min(diff * 0.5, 50);
      indicator.style.height = h + 'px';
      indicator.textContent = diff > threshold ? 'Soltar para actualizar...' : 'Tirar para actualizar...';
    }
  }, { passive: true });

  document.addEventListener('touchend', function(e) {
    if (!pulling) return;
    pulling = false;
    const indicator = document.getElementById('ptr-indicator');
    if (!indicator) return;
    const h = parseFloat(indicator.style.height) || 0;
    if (h >= threshold * 0.5) {
      indicator.classList.add('loading');
      indicator.textContent = 'Actualizando precios...';
      refreshAllPrices().finally(() => {
        indicator.classList.remove('loading');
        indicator.style.height = '0';
      });
    } else {
      indicator.style.height = '0';
    }
  }, { passive: true });
})();
</script>
