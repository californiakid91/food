<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Food">
  <meta name="theme-color" content="#0f1117">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <title>Food</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --text: #e8eaf0;
      --muted: #7a7f99;
      --accent: #5b7cf6;
      --accent2: #9b59b6;
      --green: #27ae60;
      --red: #e74c3c;
      --yellow: #f39c12;
      --radius: 10px;
      --font: 'Segoe UI', system-ui, sans-serif;
    }

    :root.light {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface2: #f0f0f2;
      --border: #d1d1d6;
      --text: #1a1a1a;
      --muted: #6e6e73;
    }

    :root.light .badge-ok   { background: #d4edda; color: #155724; }
    :root.light .badge-high { background: #f8d7da; color: #721c24; }
    :root.light .badge-low  { background: #fff3cd; color: #856404; }
    :root.light .alert-warn { background: #fff3cd; color: #856404; border-color: #ffc107; }
    :root.light .alert-info { background: #d1ecf1; color: #0c5460; border-color: #bee5eb; }
    :root.light .tab.tab-active { border-width: 2px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      min-height: 100vh;
      /* Safe area para notch/home bar de iPhone */
      padding: max(24px, env(safe-area-inset-top))
               max(16px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom))
               max(16px, env(safe-area-inset-left));
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ── Tabla ── */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th {
      text-align: left;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    input[type="text"], input[type="number"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      font-family: var(--font);
      padding: 5px 9px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--accent);
    }

    input[type="number"] { text-align: right; }

    .col-ticker { width: 75px; }
    .col-name   { width: 140px; }
    .col-precio { width: 100px; }
    .col-titulos{ width: 85px; }
    .col-valor  { width: 115px; }
    .col-obj    { width: 110px; }

    .target-display {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      transition: background 0.12s, border-color 0.12s;
    }
    .target-display:hover { background: var(--surface2); border-color: var(--border); }
    .target-display .edit-hint { font-size: 10px; color: var(--border); }
    .target-display:hover .edit-hint { color: var(--accent); }

    .target-edit {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .target-edit input {
      width: 52px;
      text-align: right;
      font-weight: 600;
    }
    .target-edit .btn-confirm { color: var(--green); background: none; border: none; font-size: 16px; padding: 2px 4px; cursor: pointer; }
    .target-edit .btn-confirm:hover { opacity: 0.7; }
    .target-edit .btn-cancel  { color: var(--red);   background: none; border: none; font-size: 16px; padding: 2px 4px; cursor: pointer; }
    .target-edit .btn-cancel:hover  { opacity: 0.7; }

    .valor-auto {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      padding: 5px 9px;
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 6px;
      width: 100%;
      text-align: right;
      cursor: default;
    }
    .col-act   { width: 90px;  text-align: right; }
    .col-dev   { width: 100px; text-align: right; }
    .col-estado{ width: 90px;  text-align: center; }
    .col-del   { width: 36px;  text-align: center; }

    .ticker-badge {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 7px;
      color: var(--muted);
      width: 100%;
    }

    .ticker-badge:focus { border-color: var(--accent); color: var(--text); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-ok     { background: #1a3a2a; color: var(--green); }
    .badge-high   { background: #3a1a1a; color: var(--red);   }
    .badge-low    { background: #3a2a10; color: var(--yellow); }

    .num { font-variant-numeric: tabular-nums; }
    .red  { color: var(--red);    }
    .green{ color: var(--green);  }
    .muted{ color: var(--muted);  }

    /* ── Botones ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }
    .btn:hover  { opacity: 0.88; }

    .btn-primary  { background: var(--accent); color: #fff; }
    .btn-ghost    { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-danger   { background: transparent; color: var(--red); border: none; font-size: 16px; padding: 2px 6px; }

    .row-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    /* ── Panel de rebalanceo ── */
    .rebalance-inputs {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .field input {
      width: 160px;
    }

    /* ── Resultados rebalanceo ── */
    .result-table th, .result-table td { padding: 8px 12px; }

    .action-buy  { color: var(--green); font-weight: 600; }
    .action-sell { color: var(--red);   font-weight: 600; }
    .action-hold { color: var(--muted); }

    /* ── Stats bar ── */
    .stats {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .stat-value { font-size: 20px; font-weight: 700; }

    /* ── Charts ── */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 700px) { .charts-grid { grid-template-columns: 1fr; } }

    canvas {
      display: block;
      margin: 0 auto;
    }

    .chart-legend {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      justify-content: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Alert ── */
    .alert {
      padding: 10px 14px;
      border-radius: 7px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .alert-warn { background: #3a2a10; color: var(--yellow); border: 1px solid #5a3a10; }
    .alert-info { background: #1a2a3a; color: var(--accent); border: 1px solid #2a3a5a; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
    }

    .tab {
      padding: 9px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
      border: 2px solid transparent;
      background: var(--surface);
      color: var(--muted);
      transition: all 0.15s;
    }

    .tab:hover { color: var(--text); }

    .tab.active-nuclear {
      background: #1a1f0a;
      border-color: #6dbf3a;
      color: #6dbf3a;
    }

    .tab.active-robotica {
      background: #0a1525;
      border-color: var(--accent);
      color: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 32px;
      color: var(--muted);
      font-size: 13px;
    }

    /* ── Histórico ── */
    .hist-table th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    .hist-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
    .hist-table tr:last-child td { border-bottom: none; }
    .hist-table tr.no-data td { color: var(--border); font-style: italic; }

    .month-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: var(--surface2);
      color: var(--muted);
    }
    .month-badge.has-data { background: #1a2a1a; color: var(--green); }

    .hist-expand { cursor: pointer; color: var(--accent); font-size: 11px; text-decoration: underline; white-space: nowrap; }
    .hist-detail { background: var(--surface2); }
    .hist-detail td { font-size: 12px; color: var(--muted); padding: 5px 10px; }

    .trend-up   { color: var(--green); }
    .trend-down { color: var(--red); }
    .trend-flat { color: var(--muted); }

    /* ── iOS / Mobile ── */

    /* Evita el zoom automático de Safari al hacer focus en inputs */
    input, select, textarea { font-size: 16px !important; }

    /* Touch targets mínimos de 44px (HIG de Apple) */
    .btn        { min-height: 44px; }
    .tab        { min-height: 44px; }
    .btn-danger { min-height: 36px; min-width: 36px; }
    .target-display { min-height: 44px; }

    /* Tap sin delay de 300ms */
    button, .tab, .target-display, a { touch-action: manipulation; }

    /* Scroll suave en tablas y tabs */
    .table-wrap { -webkit-overflow-scrolling: touch; }
    .tabs       { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }

    /* El lápiz del % objetivo siempre visible en touch (no depende de hover) */
    @media (hover: none) {
      .target-display .edit-hint { color: var(--accent); opacity: 0.7; }
      .target-display { border: 1px solid var(--border); }
    }

    /* Stats 2×2 en móvil */
    @media (max-width: 500px) {
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
      .stat-value { font-size: 17px; }
      .row-actions { flex-wrap: wrap; }
      .rebalance-inputs { flex-direction: column; }
      .rebalance-inputs .field input { width: 100%; }
      h1 { font-size: 19px; }
    }

    /* ── Lista acordeón de activos ── */
    .asset-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .asset-item.open { border-color: var(--accent); }

    .asset-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      cursor: pointer;
      touch-action: manipulation;
      min-height: 48px;
      user-select: none;
    }
    .asset-header:active { background: var(--surface2); }
    .asset-color { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .asset-ticker {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      font-weight: 700;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }
    .asset-name { font-size: 14px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .asset-value { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .asset-pct { font-size: 12px; min-width: 45px; text-align: right; }
    .asset-chevron { font-size: 10px; color: var(--muted); transition: transform 0.15s; }
    .asset-item.open .asset-chevron { transform: rotate(90deg); }

    .asset-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease;
      padding: 0 14px;
    }
    .asset-item.open .asset-body {
      max-height: 500px;
      padding: 0 14px 14px;
    }

    .asset-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
    }
    .asset-field { display: flex; flex-direction: column; gap: 3px; }
    .asset-field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; }
    .asset-field-wide { grid-column: 1 / -1; }

    .asset-stats {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .asset-stat { font-size: 12px; color: var(--muted); }
    .asset-stat strong { color: var(--text); }

    .asset-delete {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      text-align: right;
    }

    /* ── Chips de selección global ── */
    .global-chip {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--muted);
      touch-action: manipulation;
      transition: all 0.12s;
    }
    .global-chip.active {
      background: var(--surface2);
    }

    /* ── P&L colores ── */
    .pnl-positive { color: var(--green); font-weight: 600; font-size: 12px; }
    .pnl-negative { color: var(--red); font-weight: 600; font-size: 12px; }

    /* ── Theme toggle ── */
    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: var(--muted);
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
      touch-action: manipulation;
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Pull-to-refresh ── */
    .ptr-indicator {
      text-align: center;
      height: 0;
      overflow: hidden;
      transition: height 0.2s ease;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ptr-indicator.active { height: 40px; }
    .ptr-indicator.loading { height: 40px; }

    /* ── Refresh prices button ── */
    .btn-refresh-prices {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
      color: var(--muted);
      transition: border-color 0.15s, color 0.15s;
      touch-action: manipulation;
    }
    .btn-refresh-prices:hover { border-color: var(--accent); color: var(--accent); }
    .btn-refresh-prices.loading { opacity: 0.6; pointer-events: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-refresh-prices.loading span { display: inline-block; animation: spin 1s linear infinite; }

    /* ── Tabla de rebalanceo en móvil ── */
    @media (max-width: 700px) {
      .result-table { min-width: 0; }
      .result-table thead { display: none; }
      .result-table tbody tr {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 12px;
        padding: 12px;
        margin-bottom: 8px;
        background: var(--surface2);
        border-radius: 8px;
        border: 1px solid var(--border);
      }
      .result-table tbody tr td {
        border: none;
        padding: 2px 0;
        text-align: left !important;
      }
      .result-table tbody tr td::before {
        content: attr(data-label);
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--muted);
        margin-bottom: 2px;
      }
      .result-table tbody tr td:first-child { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>

<!-- ── Pull-to-refresh indicator ── -->
<div id="ptr-indicator" class="ptr-indicator">Actualizando precios...</div>

<!-- ── Header ── -->
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
  <div style="display:flex;align-items:center;gap:10px;">
    <img src="icon.svg" alt="" style="width:32px;height:32px;border-radius:7px;">
    <h1 style="margin:0;">Food</h1>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span id="save-indicator" style="font-size:12px;color:var(--green);opacity:0;transition:opacity 0.4s;"></span>
    <span id="sync-dot" title="Sin conexión" style="width:8px;height:8px;border-radius:50%;background:var(--border);display:inline-block;flex-shrink:0;"></span>
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn" title="Cambiar tema">&#9790;</button>
    <button id="auth-btn" class="btn btn-ghost" style="font-size:12px;padding:5px 12px;" onclick="toggleAuth()">Entrar</button>
  </div>
</div>
<p class="subtitle" id="sync-status">Datos en este dispositivo.</p>

<!-- ── Posición global ── -->
<div id="global-position" class="card" style="padding:14px 20px;margin-bottom:16px;">
  <div id="global-chips" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
    <div>
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">Posición total</div>
      <div id="global-total" style="font-size:26px;font-weight:700;letter-spacing:-0.5px;">—</div>
      <div id="global-delta" style="font-size:13px;margin-top:2px;"></div>
      <div id="global-pnl" style="font-size:13px;margin-top:2px;"></div>
    </div>
    <div id="global-breakdown" style="display:flex;gap:16px;flex-wrap:wrap;"></div>
  </div>
</div>

<!-- ── Selector de cartera ── -->
<div id="tabs-container" class="tabs"></div>

<!-- ── Stats de cartera activa ── -->
<div class="stats" id="stats">
  <div class="stat"><span class="stat-label">Valor</span><span class="stat-value" id="stat-total">—</span></div>
  <div class="stat"><span class="stat-label">Activos</span><span class="stat-value" id="stat-count">—</span></div>
  <div class="stat"><span class="stat-label">% Asignado</span><span class="stat-value" id="stat-obj">—</span></div>
  <div class="stat"><span class="stat-label">Desv. máx.</span><span class="stat-value" id="stat-maxdev">—</span></div>
</div>

<!-- ── Lista de activos ── -->
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <div class="card-title" id="port-card-title" style="margin:0">Cartera</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button id="btn-refresh-prices" class="btn-refresh-prices" onclick="refreshAllPrices()" title="Actualizar precios"><span>&#128260;</span></button>

<script>
// ══════════════════════════════════════════════════════════════════════
// HISTÓRICO MENSUAL
// ══════════════════════════════════════════════════════════════════════

const HIST_START = { year: 2026, month: 6 }; // Junio 2026
const MONTHS_ES  = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                     'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function histKey(portId) { return 'balance-hist-' + portId; }

function loadHistory(portId) {
  try {
    const raw = localStorage.getItem(histKey(portId));
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

function saveHistoryData(portId, snapshots) {
  localStorage.setItem(histKey(portId), JSON.stringify(snapshots));
}

// Genera secuencia de {year, month} desde HIST_START hasta hoy
function monthSequence() {
  const seq   = [];
  const now   = new Date();
  let   y = HIST_START.year, m = HIST_START.month;
  while (y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth() + 1)) {
    seq.push({ year: y, month: m });
    m++;
    if (m > 12) { m = 1; y++; }
  }
  return seq;
}

function saveMonthSnapshot() {
  const now   = new Date();
  const year  = now.getFullYear();
  const month = now.getMonth() + 1;
  const label = `${MONTHS_ES[month-1]} ${year}`;

  const snapshots = loadHistory(currentPortId);
  const existing  = snapshots.find(s => s.year === year && s.month === month);

  if (existing) {
    if (!confirm(`Ya existe un snapshot de ${label}.\n¿Sobreescribir con los datos actuales?`)) return;
    snapshots.splice(snapshots.indexOf(existing), 1);
  }

  const total = getTotal();
  const snap  = {
    id:            Date.now(),
    year, month, label,
    portfolioName: portfolios.find(p => p.id === currentPortId)?.name || '',
    totalValue:    total,
    savedAt:       Date.now(),
    assets: rows.map(r => ({
      ticker:    r.ticker  || '',
      name:      r.name    || '',
      titulos:   parseFloat(r.titulos) || 0,
      price:     parseFloat(r.price)   || 0,
      avgPrice:  parseFloat(r.avgPrice) || 0,
      value:     getRowValue(r),
      target:    parseFloat(r.target)  || 0,
      pctActual: total > 0 ? getRowValue(r) / total * 100 : 0
    }))
  };

  snapshots.push(snap);
  snapshots.sort((a,b) => a.year !== b.year ? a.year - b.year : a.month - b.month);
  saveHistoryData(currentPortId, snapshots);
  renderHistory();
  showSaveIndicator(`Snapshot ${label} guardado ✓`);
}

function deleteSnapshot(portId, snapId) {
  const snaps = loadHistory(portId).filter(s => s.id !== snapId);
  saveHistoryData(portId, snaps);
  renderHistory();
}

function toggleHistDetail(rowId) {
  const el = document.getElementById('hist-detail-' + rowId);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'table-row' : 'none';
}

function renderHistory() {
  const container = document.getElementById('history-content');
  if (!container) return;

  const snapshots = loadHistory(currentPortId);
  const snapMap   = {};
  snapshots.forEach(s => { snapMap[`${s.year}-${s.month}`] = s; });

  const seq = monthSequence();
  if (seq.length === 0) {
    container.innerHTML = '<div class="empty-state">No hay meses disponibles aún.</div>';
    return;
  }

  let html = `<div class="table-wrap"><table class="hist-table" style="width:100%;min-width:480px">
    <thead><tr>
      <th>Mes</th>
      <th style="text-align:right">Valor total</th>
      <th style="text-align:right">Variación</th>
      <th style="text-align:center">Activos</th>
      <th></th>
    </tr></thead><tbody>`;

  let prevValue = null;

  // Mostrar de más reciente a más antiguo
  [...seq].reverse().forEach(({ year, month }) => {
    const key  = `${year}-${month}`;
    const snap = snapMap[key];
    const label = `${MONTHS_ES[month-1]} ${year}`;

    if (!snap) {
      html += `<tr class="no-data">
        <td><span class="month-badge">${label}</span></td>
        <td colspan="4" style="color:var(--border);font-size:12px;">Sin datos</td>
      </tr>`;
      return;
    }

    // Calcular variación
    let trendHtml = '<span class="trend-flat">—</span>';
    // Buscar snapshot anterior
    const prevKey = month > 1
      ? `${year}-${month-1}`
      : `${year-1}-12`;
    const prevSnap = snapMap[prevKey];
    if (prevSnap) {
      const diff = snap.totalValue - prevSnap.totalValue;
      const pct  = prevSnap.totalValue > 0 ? diff / prevSnap.totalValue * 100 : 0;
      const cls  = diff > 0 ? 'trend-up' : diff < 0 ? 'trend-down' : 'trend-flat';
      const sign = diff >= 0 ? '+' : '';
      trendHtml  = `<span class="${cls}">${sign}${fmt(diff)} € (${sign}${pct.toFixed(1)}%)</span>`;
    }

    const detailId = `${year}-${month}-${currentPortId}`;

    html += `<tr>
      <td><span class="month-badge has-data">${label}</span></td>
      <td class="num" style="text-align:right;font-weight:600">${fmt(snap.totalValue)} €</td>
      <td style="text-align:right">${trendHtml}</td>
      <td style="text-align:center;color:var(--muted)">${snap.assets.length}</td>
      <td style="white-space:nowrap;text-align:right">
        <span class="hist-expand" onclick="toggleHistDetail('${detailId}')">detalle</span>
        &nbsp;
        <button class="btn btn-danger" style="font-size:13px;padding:1px 5px;"
          onclick="if(confirm('¿Eliminar snapshot de ${label}?'))deleteSnapshot('${currentPortId}',${snap.id})"
          title="Eliminar">×</button>
      </td>
    </tr>
    <tr id="hist-detail-${detailId}" style="display:none" class="hist-detail">
      <td colspan="5" style="padding:0">
        <table style="width:100%;border-collapse:collapse">
          <tr style="background:var(--surface)">
            <th style="padding:5px 12px;font-size:10px;color:var(--muted);text-align:left">Símbolo</th>
            <th style="padding:5px 12px;font-size:10px;color:var(--muted);text-align:left">Activo</th>
            <th style="padding:5px 12px;font-size:10px;color:var(--muted);text-align:right">Títulos</th>
            <th style="padding:5px 12px;font-size:10px;color:var(--muted);text-align:right">Precio</th>
            <th style="padding:5px 12px;font-size:10px;color:var(--muted);text-align:right">Valor</th>
            <th style="padding:5px 12px;font-size:10px;color:var(--muted);text-align:right">% Real</th>
            <th style="padding:5px 12px;font-size:10px;color:var(--muted);text-align:right">% Obj.</th>
          </tr>
          ${snap.assets.map(a => `
          <tr>
            <td style="padding:5px 12px;font-family:monospace;font-size:11px">${esc(a.ticker||'—')}</td>
            <td style="padding:5px 12px;font-size:12px">${esc(a.name||'—')}</td>
            <td style="padding:5px 12px;text-align:right;font-size:12px">${a.titulos||'—'}</td>
            <td style="padding:5px 12px;text-align:right;font-size:12px">${a.price ? fmtDec(a.price)+' €' : '—'}</td>
            <td style="padding:5px 12px;text-align:right;font-size:12px;font-weight:600">${fmt(a.value)} €</td>
            <td style="padding:5px 12px;text-align:right;font-size:12px">${a.pctActual.toFixed(1)}%</td>
            <td style="padding:5px 12px;text-align:right;font-size:12px;color:var(--accent)">${a.target}%</td>
          </tr>`).join('')}
        </table>
      </td>
    </tr>`;
  });

  html += '</tbody></table></div>';

  if (snapshots.length === 0) {
    html += '<div class="empty-state" style="margin-top:12px">Pulsa «+ Guardar mes actual» para guardar el snapshot de este mes.</div>';
  }

  container.innerHTML = html;
}

// ══════════════════════════════════════════════════════════════════════
// EXCEL PARA DECLARACIÓN DE LA RENTA (España, IRPF)
// ══════════════════════════════════════════════════════════════════════

function exportTaxExcel() {
  const year = new Date().getFullYear();
  const allMonths = MONTHS_ES.map((name, i) => ({ name, month: i + 1 }));

  let sheetsHtml = '';

  portfolios.forEach((port, pi) => {
    const snapshots = loadHistory(port.id);
    const snapMap   = {};
    snapshots.forEach(s => { if (s.year === year) snapMap[s.month] = s; });

    // Reconstruir base de coste acumulada desde todos los snapshots
    const costBasis = {};
    snapshots.filter(s => s.year <= year).forEach(s => {
      s.assets.forEach(a => {
        const key = a.ticker || a.name;
        if (!costBasis[key]) costBasis[key] = { ticker: a.ticker, name: a.name, titulos: 0, totalCost: 0 };
        // Tomar los títulos del último snapshot del activo
        costBasis[key].titulos   = a.titulos;
        costBasis[key].lastPrice = a.price;
        costBasis[key].lastValue = a.value;
      });
    });

    const sepStyle = pi > 0 ? 'mso-break-type:section-break' : '';

    sheetsHtml += `
      ${pi > 0 ? `<br style="${sepStyle}">` : ''}
      <table border="1" style="border-collapse:collapse;font-family:Calibri,Arial;font-size:11pt;mso-number-format:General">
        <tr>
          <td colspan="14" style="background:#1a1a2e;color:#ffffff;font-size:14pt;font-weight:bold;padding:10px">
            Declaración de la Renta ${year} — ${port.name}
          </td>
        </tr>
        <tr><td colspan="14" style="height:10px;border:none"></td></tr>

        <!-- SECCIÓN 1: Evolución mensual -->
        <tr>
          <td colspan="14" style="background:#2e3350;color:#e8eaf0;font-weight:bold;padding:6px 10px">
            1. Evolución del valor de la cartera (${year})
          </td>
        </tr>
        <tr style="background:#f0f0f0;font-weight:bold">
          <td style="padding:5px 8px">Mes</td>
          <td style="padding:5px 8px;text-align:right">Valor total (€)</td>
          <td style="padding:5px 8px;text-align:right">Variación (€)</td>
          <td style="padding:5px 8px;text-align:right">Variación (%)</td>
          <td style="padding:5px 8px">Nota</td>
        </tr>
        ${allMonths.map(({ name, month }) => {
          const snap     = snapMap[month];
          const prevSnap = snapMap[month - 1] || (month === 1 ? snapMap[12] : null);
          let varEur = '', varPct = '', nota = '';
          if (snap && prevSnap) {
            const diff = snap.totalValue - prevSnap.totalValue;
            varEur = (diff >= 0 ? '+' : '') + fmt(diff);
            varPct = prevSnap.totalValue > 0
              ? (diff >= 0 ? '+' : '') + (diff / prevSnap.totalValue * 100).toFixed(2) + '%'
              : '';
          }
          return `<tr>
            <td style="padding:4px 8px">${name}</td>
            <td style="padding:4px 8px;text-align:right">${snap ? fmt(snap.totalValue) + ' €' : '—'}</td>
            <td style="padding:4px 8px;text-align:right;color:${varEur.startsWith('+') ? 'green' : varEur ? 'red' : 'inherit'}">${varEur}</td>
            <td style="padding:4px 8px;text-align:right;color:${varPct.startsWith('+') ? 'green' : varPct ? 'red' : 'inherit'}">${varPct}</td>
            <td style="padding:4px 8px;color:#888">${nota}</td>
          </tr>`;
        }).join('')}

        <tr><td colspan="14" style="height:14px;border:none"></td></tr>

        <!-- SECCIÓN 2: Detalle activos (último snapshot del año) -->
        ${(() => {
          const lastSnap = [...snapshots].filter(s => s.year === year).sort((a,b) => b.month - a.month)[0];
          if (!lastSnap) return '<tr><td colspan="14" style="color:#888;padding:6px 10px">Sin snapshots en ' + year + '</td></tr>';
          return `
          <tr>
            <td colspan="14" style="background:#2e3350;color:#e8eaf0;font-weight:bold;padding:6px 10px">
              2. Composición a ${lastSnap.label} (último snapshot ${year})
            </td>
          </tr>
          <tr style="background:#f0f0f0;font-weight:bold">
            <td style="padding:5px 8px">Símbolo</td>
            <td style="padding:5px 8px">Activo</td>
            <td style="padding:5px 8px;text-align:right">Títulos</td>
            <td style="padding:5px 8px;text-align:right">Precio/ud. (€)</td>
            <td style="padding:5px 8px;text-align:right">Valor (€)</td>
            <td style="padding:5px 8px;text-align:right">% Cartera</td>
            <td style="padding:5px 8px;text-align:right">% Objetivo</td>
          </tr>
          ${lastSnap.assets.map(a => `
          <tr>
            <td style="padding:4px 8px;font-family:monospace">${esc(a.ticker||'')}</td>
            <td style="padding:4px 8px">${esc(a.name||'')}</td>
            <td style="padding:4px 8px;text-align:right">${a.titulos || '—'}</td>
            <td style="padding:4px 8px;text-align:right">${a.price ? fmtDec(a.price) : '—'}</td>
            <td style="padding:4px 8px;text-align:right;font-weight:bold">${fmt(a.value)}</td>
            <td style="padding:4px 8px;text-align:right">${a.pctActual.toFixed(2)}%</td>
            <td style="padding:4px 8px;text-align:right;color:#3060c0">${a.target}%</td>
          </tr>`).join('')}
          <tr style="font-weight:bold;background:#f8f8f8">
            <td colspan="4" style="padding:4px 8px">TOTAL</td>
            <td style="padding:4px 8px;text-align:right">${fmt(lastSnap.totalValue)} €</td>
            <td colspan="2"></td>
          </tr>`;
        })()}

        <tr><td colspan="14" style="height:14px;border:none"></td></tr>

        <!-- SECCIÓN 3: Base de coste para plusvalías -->
        <tr>
          <td colspan="14" style="background:#2e3350;color:#e8eaf0;font-weight:bold;padding:6px 10px">
            3. Base de coste para cálculo de plusvalías (IRPF)
          </td>
        </tr>
        <tr>
          <td colspan="14" style="color:#888;font-size:9pt;padding:4px 10px;font-style:italic">
            Las ganancias patrimoniales tributan al tipo de ahorro (19%-28%) en el momento de la venta.
            Conserva justificantes de compra. Esta tabla es orientativa.
          </td>
        </tr>
        <tr style="background:#f0f0f0;font-weight:bold">
          <td style="padding:5px 8px">Símbolo</td>
          <td style="padding:5px 8px">Activo</td>
          <td style="padding:5px 8px;text-align:right">Títulos</td>
          <td style="padding:5px 8px;text-align:right">Precio último (€)</td>
          <td style="padding:5px 8px;text-align:right">Valor mercado (€)</td>
          <td style="padding:5px 8px">Tramo IRPF (referencia)</td>
        </tr>
        ${Object.values(costBasis).length === 0
          ? '<tr><td colspan="6" style="padding:6px 10px;color:#888">Sin datos de base de coste</td></tr>'
          : Object.values(costBasis).map(cb => `
          <tr>
            <td style="padding:4px 8px;font-family:monospace">${esc(cb.ticker||'')}</td>
            <td style="padding:4px 8px">${esc(cb.name||'')}</td>
            <td style="padding:4px 8px;text-align:right">${cb.titulos || '—'}</td>
            <td style="padding:4px 8px;text-align:right">${cb.lastPrice ? fmtDec(cb.lastPrice) : '—'}</td>
            <td style="padding:4px 8px;text-align:right;font-weight:bold">${fmt(cb.lastValue || 0)}</td>
            <td style="padding:4px 8px;color:#888;font-size:9pt">
              Hasta 6.000€: 19% | 6.000-50.000€: 21% | 50.000-200.000€: 23% | >200.000€: 27%
            </td>
          </tr>`).join('')}

        <tr><td colspan="14" style="height:20px;border:none"></td></tr>
        <tr>
          <td colspan="14" style="color:#aaa;font-size:8pt;padding:4px 10px;font-style:italic">
            Generado por Balanceo de Cartera — ${new Date().toLocaleDateString('es-ES')} — Solo orientativo, consulta un asesor fiscal.
          </td>
        </tr>
      </table>`;
  });

  const xls = `<html xmlns:o="urn:schemas-microsoft-com:office:office"
    xmlns:x="urn:schemas-microsoft-com:office:excel"
    xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="UTF-8">
    <!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>
      ${portfolios.map(p => `<x:ExcelWorksheet><x:Name>${esc(p.name.replace(/[^a-zA-Z0-9 áéíóúÁÉÍÓÚñÑ]/g,''))}</x:Name></x:ExcelWorksheet>`).join('')}
    </x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
    </head><body>${sheetsHtml}</body></html>`;

  const blob = new Blob([xls], { type: 'application/vnd.ms-excel;charset=utf-8' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `renta-${year}.xls`;
  a.click();
  URL.revokeObjectURL(a.href);
}

    dot.title = 'Error de autenticación';
    status.textContent = 'Error de autenticación.';
    status.style.display = 'block';
    if (btn) { btn.textContent = 'Entrar'; btn.style.padding = '5px 12px'; }
  } else {
    dot.style.background = 'var(--border)';
    dot.title = 'Sin conexión';
    status.textContent = 'Datos en este dispositivo. Entra con Google para sincronizar.';
    status.style.display = 'block';
    if (btn) { btn.textContent = 'Entrar'; btn.style.padding = '5px 12px'; }
  }
}

function isMobile() {
  return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
}

async function toggleAuth() {
  if (currentUser) {
    if (confirm('¿Cerrar sesión? Los datos se mantienen en este dispositivo.')) {
      auth.signOut();
    }
  } else {
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      await auth.signInWithPopup(provider);
    } catch(e) {
      console.error('auth error:', e.code, e.message);
      if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
        alert('Error de login: ' + e.message);
      }
    }
  }
}

function userDocRef() {
  if (!currentUser) return null;
  return db.collection('users').doc(currentUser.uid);
}

function buildSyncPayload() {
  const portfolioData = {};
  portfolios.forEach(p => {
    if (p.id === currentPortId) {
      portfolioData[p.id] = { rows, nextId };
    } else {
      try {
        const raw = localStorage.getItem(rowsKey(p.id));
        if (raw) portfolioData[p.id] = JSON.parse(raw);
      } catch {}
    }
  });
  const historyData = {};
  portfolios.forEach(p => {
    try {
      const raw = localStorage.getItem(histKey(p.id));
      if (raw) historyData[p.id] = JSON.parse(raw);
    } catch {}
  });
  return { portfolios, currentPortId, nextId, portfolioData, historyData, savedAt: Date.now() };
}

function applySyncPayload(data) {
  if (!data.portfolios || !data.portfolios.length) return false;
  portfolios    = data.portfolios;
  currentPortId = data.currentPortId || portfolios[0].id;
  nextId        = data.nextId || 1;
  Object.entries(data.portfolioData || {}).forEach(([id, pd]) => {
    if (pd.nextId) nextId = Math.max(nextId, pd.nextId);
    localStorage.setItem(rowsKey(id), JSON.stringify(pd));
  });
  Object.entries(data.historyData || {}).forEach(([id, hist]) => {
    localStorage.setItem(histKey(id), JSON.stringify(hist));
  });
  localStorage.setItem(META_KEY, JSON.stringify({ portfolios, currentPortId, nextId }));
  rows = loadRows(currentPortId);
  return true;
}

async function pullFromFirestore() {
  const ref = userDocRef();
  if (!ref) return false;
  try {
    const doc = await ref.get();
    if (!doc.exists) return false;
    const data = doc.data();
    if (!data.portfolios) return false;
    const localMeta  = localStorage.getItem(META_KEY);
    const localSaved = localMeta ? (JSON.parse(localMeta).savedAt || 0) : 0;
    if ((data.savedAt || 0) >= localSaved) applySyncPayload(data);
    setSyncUI('ok');
    return true;
  } catch(e) { console.error('pullFromFirestore:', e); return false; }
}

function schedulePush() {
  if (!currentUser) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    const ref = userDocRef();
    if (!ref) return;
    try {
      const payload = buildSyncPayload();
      console.log('Push to Firestore:', payload.portfolios?.length, 'portfolios, savedAt:', payload.savedAt);
      await ref.set(payload);
      setSyncUI('ok');
    } catch(e) { console.error('schedulePush:', e); }
  }, 800);
}

function listenFirestore() {
  if (unsubFirestore) unsubFirestore();
  const ref = userDocRef();
  if (!ref) return;
  unsubFirestore = ref.onSnapshot(doc => {
    if (!doc.exists) return;
    const data = doc.data();
    const localMeta  = localStorage.getItem(META_KEY);
    const localSaved = localMeta ? (JSON.parse(localMeta).savedAt || 0) : 0;
    if ((data.savedAt || 0) > localSaved) {
      applySyncPayload(data);
      setNewMoneyInput();
      renderTabs();
      render();
      setTimeout(resizeCharts, 50);
    }
  }, () => {});
}

auth.onAuthStateChanged(async user => {
  currentUser = user;
  if (user) {
    setSyncUI('ok');
    try {
      const synced = await pullFromFirestore();
      if (!synced) {
        const hasLocalData = portfolios.some(p => {
          const r = (p.id === currentPortId) ? rows : (() => { try { const raw = localStorage.getItem(rowsKey(p.id)); return raw ? (JSON.parse(raw).rows || []) : []; } catch { return []; } })();
          return r.length > 0;
        });
        if (hasLocalData) {
          const ref = userDocRef();
          if (ref) await ref.set(buildSyncPayload());
        }
      }
      listenFirestore();
      setNewMoneyInput();
      renderTabs();
      render();
      setTimeout(resizeCharts, 50);
    } catch(e) {
      console.error('onAuthStateChanged:', e);
      setSyncUI('ok');
    }
  } else {
    if (unsubFirestore) { unsubFirestore(); unsubFirestore = null; }
    setSyncUI('offline');
  }
});

// ── Estado ──
let rows    = [];
let nextId  = 1;
let portfolios      = [];   // [{ id, name }, ...]
let currentPortId   = null;

function genId() { return nextId++; }
function genPortId() { return 'p' + Date.now() + Math.random().toString(36).slice(2,6); }

// ── Claves de almacenamiento ──
const META_KEY   = 'balance-meta-v2';
function rowsKey(id) { return 'balance-rows-' + id; }

// ── Persistencia meta (lista de carteras + activa) ──
function saveMeta() {
  try {
    localStorage.setItem(META_KEY, JSON.stringify({ portfolios, currentPortId, nextId, savedAt: Date.now() }));
  } catch(e) {}
}

function saveRows() {
  try {
    localStorage.setItem(rowsKey(currentPortId), JSON.stringify({ rows, nextId }));
    showSaveIndicator();
  } catch(e) {}
}

function loadRows(id) {
  try {
    const raw = localStorage.getItem(rowsKey(id));
    if (!raw) return [];
    const data = JSON.parse(raw);
    if (data.nextId) nextId = Math.max(nextId, data.nextId);
    return data.rows || [];
  } catch(e) { return []; }
}

let saveTimer;
function schedSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveRows();
    saveMeta();
    schedulePush();
  }, 600);
}

function showSaveIndicator(text = 'Guardado ✓') {
  const el = document.getElementById('save-indicator');
  if (!el) return;
  el.textContent = text;
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 1800);
}

// ── Gestión de carteras ──
function initPortfolios() {
  try {
    const raw = localStorage.getItem(META_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data.portfolios && data.portfolios.length > 0) {
        portfolios    = data.portfolios;
        currentPortId = data.currentPortId || portfolios[0].id;
        if (data.nextId) nextId = Math.max(nextId, data.nextId);
        rows = loadRows(currentPortId);
        return true;
      }
    }
  } catch(e) {}
  return false;
}

function createDefaultPortfolios() {
  const pNuclear  = { id: genPortId(), name: '☢ Nuclear',   defaultMoney: 250 };
  const pRobotica = { id: genPortId(), name: '🤖 Robótica',  defaultMoney: 250 };
  portfolios    = [pNuclear, pRobotica];
  currentPortId = pNuclear.id;
  rows = [];
  saveMeta();
}

function onNewMoneyChange(val) {
  const port = portfolios.find(p => p.id === currentPortId);
  if (port) port.defaultMoney = parseFloat(val) || 0;
  schedSave();
  calcRebalance();
}

function setNewMoneyInput() {
  const port = portfolios.find(p => p.id === currentPortId);
  document.getElementById('new-money').value = port?.defaultMoney ?? 250;
}

function switchPortfolio(id) {
  if (id === currentPortId) return;
  saveRows();
  currentPortId = id;
  rows = loadRows(id);
  saveMeta();
  setNewMoneyInput();
  renderTabs();
  render();
}

function addPortfolio() {
  const name = prompt('Nombre de la nueva cartera:');
  if (!name || !name.trim()) return;
  const port = { id: genPortId(), name: name.trim() };
  portfolios.push(port);
  saveMeta();
  switchPortfolio(port.id);
}

function deletePortfolio(id) {
  const port = portfolios.find(p => p.id === id);
  if (!port) return;
  if (portfolios.length === 1) { alert('Debes tener al menos una cartera.'); return; }
  if (!confirm(`¿Eliminar la cartera "${port.name}"? Se borrarán todos sus datos.`)) return;
  localStorage.removeItem(rowsKey(id));
  portfolios = portfolios.filter(p => p.id !== id);
  if (currentPortId === id) {
    currentPortId = portfolios[0].id;
    rows = loadRows(currentPortId);
  }
  saveMeta();
  renderTabs();
  render();
}

function renamePortfolio(id) {
  const port = portfolios.find(p => p.id === id);
  if (!port) return;
  const name = prompt('Nuevo nombre:', port.name);
  if (!name || !name.trim()) return;
  port.name = name.trim();
  saveMeta();
  renderTabs();
}

// ── Borrar datos de la cartera activa ──
function clearStorage() {
  const port = portfolios.find(p => p.id === currentPortId);
  if (!confirm(`¿Borrar todos los activos de "${port ? port.name : 'esta cartera'}"?`)) return;
  rows = [];
  nextId = 1;
  saveRows();
  render();
}

// ── Renderizar tabs ──
function renderTabs() {
  const container = document.getElementById('tabs-container');
  let html = '';
  portfolios.forEach((p, i) => {
    const c = TAB_COLORS[i % TAB_COLORS.length];
    const isActive = p.id === currentPortId;
    const style = isActive
      ? `background:${c.bg};border-color:${c.border};color:${c.text};`
      : '';
    html += `
      <button class="tab${isActive ? ' tab-active' : ''}" style="${style}"
        onclick="switchPortfolio('${p.id}')"
        ondblclick="renamePortfolio('${p.id}')"
        title="Doble clic para renombrar">
        ${esc(p.name)}
      </button>
    `;
  });
  html += `<button class="tab" onclick="addPortfolio()" style="color:var(--muted);border-style:dashed;" title="Nueva cartera">+ Nueva</button>`;
  container.innerHTML = html;
}

// ── Inicialización ──
window.addEventListener('load', () => {
  const loaded = initPortfolios();
  if (!loaded) createDefaultPortfolios();
  setNewMoneyInput();
  renderTabs();
  render();
  setTimeout(resizeCharts, 50);
  if (currentUser) setSyncUI('ok');
});

function addRow() {
  rows.push({ id: genId(), name: '', value: 0, target: 0, avgPrice: 0 });
  schedSave();
  render();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.input-name');
    if (inputs.length) inputs[inputs.length - 1].focus();

function deleteRow(id) {

  schedSave();
  render();
}

function deletePortfolioActive() {

}

// ── Render principal ──
function render() {
  const port = portfolios.find(p => p.id === currentPortId);
  document.getElementById('port-card-title').textContent = port ? port.name : 'Cartera';
  renderTable();
  updateStats();
  calcRebalance();
  drawCharts();
  renderHistory();
  renderGlobalPosition();

let globalSelectedPorts = new Set();

function toggleGlobalPort(portId) {
  if (globalSelectedPorts.has(portId)) {
    globalSelectedPorts.delete(portId);
  } else {
    globalSelectedPorts.add(portId);
  }
  renderGlobalPosition();
}

function renderGlobalPosition() {
  const totalEl     = document.getElementById('global-total');
  const breakdownEl = document.getElementById('global-breakdown');
  const chipsEl     = document.getElementById('global-chips');
  if (!totalEl || !breakdownEl || !chipsEl) return;

  if (globalSelectedPorts.size === 0) {
    portfolios.forEach(p => globalSelectedPorts.add(p.id));
  }

  let chipsHtml = '';
  const parts = [];

  portfolios.forEach((p, i) => {
    const c = TAB_COLORS[i % TAB_COLORS.length];
    const active = globalSelectedPorts.has(p.id);

    chipsHtml += `<button class="global-chip${active ? ' active' : ''}"
      style="${active ? `border-color:${c.border};color:${c.text};` : ''}"
      onclick="toggleGlobalPort('${p.id}')">${esc(p.name)}</button>`;

    let portRows;
    if (p.id === currentPortId) {
      portRows = rows;
    } else {
      try {
        const raw = localStorage.getItem(rowsKey(p.id));
        portRows = raw ? (JSON.parse(raw).rows || []) : [];
      } catch { portRows = []; }
    }
    const portTotal = portRows.reduce((s, r) => s + getRowValue(r), 0);
    parts.push({ id: p.id, name: p.name, total: portTotal, color: c.text, active });
  });

  chipsEl.innerHTML = chipsHtml;

  const selected = parts.filter(p => p.active);
  const grandTotal = selected.reduce((s, p) => s + p.total, 0);

  // Compare with most recent history snapshot for delta coloring (feature #6)
  const deltaEl = document.getElementById('global-delta');
  const pnlEl = document.getElementById('global-pnl');
  let lastSnapTotal = 0;
  let hasSnap = false;
  selected.forEach(p => {
    const snaps = loadHistory(p.id);
    if (snaps.length > 0) {
      lastSnapTotal += snaps[snaps.length - 1].totalValue || 0;
      hasSnap = true;
    }
  });

  if (hasSnap && grandTotal > 0) {
    const delta = grandTotal - lastSnapTotal;
    const deltaPct = lastSnapTotal > 0 ? (delta / lastSnapTotal * 100) : 0;
    const sign = delta >= 0 ? '+' : '';
    const cls = delta >= 0 ? 'color:var(--green)' : 'color:var(--red)';
    totalEl.style.color = delta >= 0 ? 'var(--green)' : 'var(--red)';
    if (deltaEl) deltaEl.innerHTML = `<span style="${cls};font-weight:600;">vs último snapshot: ${sign}${fmt(delta)} € (${sign}${deltaPct.toFixed(1)}%)</span>`;
  } else {
    totalEl.style.color = '';
    if (deltaEl) deltaEl.innerHTML = '';
  }

  // Global P&L from avgPrice data (feature #3)
  if (pnlEl) {
    let totalPnlVal = 0;
    let totalCostVal = 0;
    let hasPnlData = false;
    selected.forEach(p => {
      let portRows;
      if (p.id === currentPortId) {
        portRows = rows;
      } else {
        try {
          const raw = localStorage.getItem(rowsKey(p.id));
          portRows = raw ? (JSON.parse(raw).rows || []) : [];
        } catch { portRows = []; }
      }
      portRows.forEach(r => {
        const pnlData = getRowPnl(r);
        if (pnlData) {
          totalPnlVal += pnlData.pnl;
          totalCostVal += (parseFloat(r.avgPrice) || 0) * (parseFloat(r.titulos) || 0);
          hasPnlData = true;
        }
      });
    });
    if (hasPnlData) {
      const pnlPct = totalCostVal > 0 ? (totalPnlVal / totalCostVal * 100) : 0;
      const sign = totalPnlVal >= 0 ? '+' : '';
      const cls = totalPnlVal >= 0 ? 'pnl-positive' : 'pnl-negative';
      pnlEl.innerHTML = `<span class="${cls}">P&L: ${sign}${fmt(totalPnlVal)} € (${sign}${pnlPct.toFixed(1)}%)</span>`;
    } else {
      pnlEl.innerHTML = '';
    }
  }

  totalEl.textContent = fmt(grandTotal) + ' €';
  breakdownEl.innerHTML = selected.map(p =>
    `<div style="text-align:center;">
      <div style="font-size:10px;color:var(--muted);">${esc(p.name)}</div>
      <div style="font-size:15px;font-weight:600;color:${p.color}">${fmt(p.total)} €</div>
    </div>`
  ).join('');
}

  const t = parseFloat(row.titulos) || 0;
  const p = parseFloat(row.price)   || 0;
  if (t > 0 && p > 0) return t * p;
  return parseFloat(row.value) || 0;
}

function confirmTarget(id) {
  const inp = document.getElementById('target-input-' + id);
  if (!inp) return;
  const newVal = parseFloat(inp.value) || 0;
  const row = rows.find(r => r.id === id);
  if (!row) return;
  if (row.target == newVal) return;
  row.target = newVal;
  refreshRowDerived(id, 'target');
  const totalObj = rows.reduce((s, r) => s + (parseFloat(r.target) || 0), 0);
  document.getElementById('obj-warning').style.display =
    (rows.length > 0 && Math.abs(totalObj - 100) > 0.01) ? 'block' : 'none';
  updateStats();
  calcRebalance();
  drawCharts();
  schedSave();
  showSaveIndicator('Objetivo guardado ✓');
}

function autocompleteTicker(id, ticker) {
  const row = rows.find(r => r.id === id);
  if (!row) return;
  const t = ticker.trim().toUpperCase();
  row.ticker = ticker;
  if (TICKER_NAMES[t] && (!row.name || row.name === '' || TICKER_NAMES[row._lastAutoTicker])) {
    row.name = TICKER_NAMES[t];
    row._lastAutoTicker = t;
    const nameInput = document.querySelector(`.asset-item[data-id="${id}"] .input-name`);
    if (nameInput) nameInput.value = row.name;
  }
  schedSave();
}

function getTotal() {
  return rows.reduce((s, r) => s + getRowValue(r), 0);
}

let openAssetId = null;

function toggleAsset(id) {
  openAssetId = openAssetId === id ? null : id;
  renderTable();
}

function renderTable() {
  const container = document.getElementById('portfolio-list');
  const total = getTotal();
  const totalObj = rows.reduce((s, r) => s + (parseFloat(r.target) || 0), 0);

  document.getElementById('obj-warning').style.display =
    (rows.length > 0 && Math.abs(totalObj - 100) > 0.01) ? 'block' : 'none';

  if (rows.length === 0) {
    container.innerHTML = '<div class="empty-state">Añade activos para empezar.</div>';
    return;
  }

  let html = '';
  rows.forEach((row, i) => {
    const price   = parseFloat(row.price)   || 0;
    const titulos = parseFloat(row.titulos) || 0;
    const isAuto  = titulos > 0 && price > 0;
    const val     = getRowValue(row);
    const tgt     = parseFloat(row.target)  || 0;
    const actual  = total > 0 ? (val / total * 100) : 0;
    const dev     = actual - tgt;
    const color   = PALETTE[i % PALETTE.length];
    const isOpen  = openAssetId === row.id;

    let badge = '';
    if (Math.abs(dev) < 1)  badge = '<span class="badge badge-ok">OK</span>';
    else if (dev > 0)        badge = '<span class="badge badge-high">Alto</span>';
    else                     badge = '<span class="badge badge-low">Bajo</span>';

    const devClass = dev > 1 ? 'red' : dev < -1 ? 'green' : 'muted';
    const ticker   = row.ticker ? row.ticker.toUpperCase() : '';
    const label    = ticker || row.name || 'Nuevo activo';

    html += `
      <div class="asset-item${isOpen ? ' open' : ''}" data-id="${row.id}">
        <div class="asset-header" onclick="toggleAsset(${row.id})">
          <div class="asset-color" style="background:${color}"></div>
          ${ticker ? `<span class="asset-ticker">${esc(ticker)}</span>` : ''}
          <span class="asset-name">${esc(row.name || (ticker ? '' : 'Sin nombre'))}</span>
          <span class="asset-value">${val > 0 ? fmt(val) + ' €' : ''}</span>
          <span class="asset-pnl">${(() => { const p = getRowPnl(row); return p ? formatPnl(p) : ''; })()}</span>
          <span class="asset-pct ${devClass}">${tgt > 0 ? actual.toFixed(1) + '%' : ''}</span>
          <span class="asset-badge">${badge}</span>
          <span class="asset-chevron">&#9654;</span>
        </div>
        <div class="asset-body">
          <div class="asset-fields">
            <div class="asset-field">
              <label>Símbolo</label>
              <input class="ticker-badge" type="text" value="${esc(row.ticker||'')}" placeholder="TICKER"
                oninput="autocompleteTicker(${row.id},this.value)" onclick="event.stopPropagation()">
            </div>
            <div class="asset-field">
              <label>Nombre</label>
              <input class="input-name" type="text" value="${esc(row.name)}" placeholder="Nombre del activo"
                oninput="updateRow(${row.id},'name',this.value)" onclick="event.stopPropagation()">
            </div>
            <div class="asset-field">
              <label>Precio (€)</label>
              <input type="number" value="${price||''}" placeholder="0.00" min="0" step="0.01"
                oninput="updateRow(${row.id},'price',this.value)">
            </div>
            <div class="asset-field">
              <label>Títulos</label>
              <input type="number" value="${titulos||''}" placeholder="0" min="0" step="1"
                oninput="updateRow(${row.id},'titulos',this.value)">
            </div>
            <div class="asset-field" id="valor-field-${row.id}">
              <label>Valor (€)</label>
              ${isAuto
                ? `<div class="valor-auto">${fmtDec(val)} € <span style="font-size:11px;color:var(--border)">(${titulos} × ${fmtDec(price)})</span></div>`
                : `<input type="number" value="${val || ''}" placeholder="0" min="0" step="100"
                     oninput="updateRow(${row.id},'value',this.value)">`}
            </div>
            <div class="asset-field" id="target-field-${row.id}">
              <label>% Objetivo</label>
              <div style="display:flex;gap:4px;align-items:center;">
                <input id="target-input-${row.id}" type="number" value="${tgt || ''}" placeholder="0" min="0" step="1"
                  style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();confirmTarget(${row.id});}">
                <button class="btn btn-ghost" style="padding:4px 8px;font-size:14px;min-height:32px;color:var(--green);" onclick="confirmTarget(${row.id})" title="Confirmar">&#10003;</button>
              </div>
            </div>
            <div class="asset-field">
              <label>Precio medio (€)</label>
              <input type="number" value="${parseFloat(row.avgPrice) || ''}" placeholder="0.00" min="0" step="0.01"
                oninput="updateRow(${row.id},'avgPrice',this.value)">
            </div>
          </div>
          <div class="asset-stats" id="stats-field-${row.id}">
            <span class="asset-stat">Actual: <strong>${actual.toFixed(1)}%</strong></span>
            <span class="asset-stat">Objetivo: <strong>${tgt}%</strong></span>
            <span class="asset-stat ${devClass}">Desv: <strong>${(dev >= 0 ? '+' : '') + dev.toFixed(1)}%</strong></span>
            ${(() => { const p = getRowPnl(row); return p ? `<span class="asset-stat">P&L: ${formatPnl(p)}</span>` : ''; })()}
          </div>
          <div class="asset-delete">
            <button class="btn btn-danger" style="font-size:13px;padding:4px 10px;" onclick="deleteRow(${row.id})">Eliminar activo</button>
          </div>
        </div>
      </div>`;
  });

  container.innerHTML = html;
}

function updateRow(id, field, value) {
  const row = rows.find(r => r.id === id);
  if (!row) return;
  row[field] = (field === 'name' || field === 'ticker') ? value : (parseFloat(value) || 0);
  if (field === 'titulos' || field === 'price' || field === 'value' || field === 'target' || field === 'avgPrice') {
    // Actualización dirigida: NO reconstruimos la tabla (eso destruiría el
    // input que el usuario está editando y le haría perder el foco).
    refreshRowDerived(id, field);
  }
  updateStats();
  calcRebalance();
  drawCharts();
  schedSave();
}

// Actualiza solo las partes derivadas (no-input) de una fila tras editar
// un campo numérico, preservando el foco del input que se está escribiendo.
function refreshRowDerived(id, editedField) {
  const el  = document.querySelector(`.asset-item[data-id="${id}"]`);
  const row = rows.find(r => r.id === id);
  if (!el || !row) return;

  const total   = getTotal();
  const price   = parseFloat(row.price)   || 0;
  const titulos = parseFloat(row.titulos) || 0;
  const isAuto  = titulos > 0 && price > 0;
  const val     = getRowValue(row);
  const tgt     = parseFloat(row.target)  || 0;
  const actual  = total > 0 ? (val / total * 100) : 0;
  const dev     = actual - tgt;
  const devClass = dev > 1 ? 'red' : dev < -1 ? 'green' : 'muted';

  let badge = '';
  if (Math.abs(dev) < 1) badge = '<span class="badge badge-ok">OK</span>';
  else if (dev > 0)      badge = '<span class="badge badge-high">Alto</span>';
  else                   badge = '<span class="badge badge-low">Bajo</span>';

  const pnl = getRowPnl(row);

  // Cabecera
  const valEl = el.querySelector('.asset-value');
  if (valEl) valEl.textContent = val > 0 ? fmt(val) + ' €' : '';
  const pnlEl = el.querySelector('.asset-pnl');
  if (pnlEl) pnlEl.innerHTML = pnl ? formatPnl(pnl) : '';
  const pctEl = el.querySelector('.asset-pct');
  if (pctEl) { pctEl.className = 'asset-pct ' + devClass; pctEl.textContent = tgt > 0 ? actual.toFixed(1) + '%' : ''; }
  const badgeEl = el.querySelector('.asset-badge');
  if (badgeEl) badgeEl.innerHTML = badge;

  // Celda "Valor": solo se reconstruye cuando NO se está editando ese campo
  // directamente (al editar 'value' su input tiene el foco y no debe tocarse).
  if (editedField !== 'value') {
    const valorField = document.getElementById('valor-field-' + id);
    if (valorField) {
      valorField.innerHTML = `<label>Valor (€)</label>
        ${isAuto
          ? `<div class="valor-auto">${fmtDec(val)} € <span style="font-size:11px;color:var(--border)">(${titulos} × ${fmtDec(price)})</span></div>`
          : `<input type="number" value="${val || ''}" placeholder="0" min="0" step="100"
               oninput="updateRow(${id},'value',this.value)">`}`;
    }
  }

  // Línea de estadísticas del activo
  const statsField = document.getElementById('stats-field-' + id);
  if (statsField) {
    statsField.innerHTML = `
      <span class="asset-stat">Actual: <strong>${actual.toFixed(1)}%</strong></span>
      <span class="asset-stat">Objetivo: <strong>${tgt}%</strong></span>
      <span class="asset-stat ${devClass}">Desv: <strong>${(dev >= 0 ? '+' : '') + dev.toFixed(1)}%</strong></span>
      ${pnl ? `<span class="asset-stat">P&L: ${formatPnl(pnl)}</span>` : ''}`;
  }
}


// ── Stats ──
function updateStats() {
  const total = getTotal();
  const totalObj = rows.reduce((s, r) => s + (parseFloat(r.target) || 0), 0);
  const maxDev = rows.length === 0 ? 0 : Math.max(...rows.map(r => {
    const val = getRowValue(r);
    const act = total > 0 ? val / total * 100 : 0;
    return Math.abs(act - (parseFloat(r.target) || 0));
  }));

  document.getElementById('stat-total').textContent = fmt(total) + ' €';
  document.getElementById('stat-count').textContent = rows.length;
  document.getElementById('stat-obj').textContent = totalObj.toFixed(1) + '%';
  document.getElementById('stat-maxdev').textContent = maxDev.toFixed(1) + '%';
  document.getElementById('stat-maxdev').className = 'stat-value ' + (maxDev > 5 ? 'red' : maxDev > 2 ? 'yellow' : 'green');
}

// ── Cálculo de rebalanceo ──
function calcRebalance() {
  const container = document.getElementById('rebalance-result');
  if (rows.length === 0) {
    container.innerHTML = '<div class="empty-state">Añade activos para calcular el rebalanceo.</div>';
    return;
  }

  const total    = getTotal();
  const newMoney = parseFloat(document.getElementById('new-money').value) || 0;

  if (newMoney <= 0) {
    container.innerHTML = '<div class="empty-state">Introduce el dinero mensual a invertir para ver las sugerencias de compra.</div>';
    return;
  }

  const newTotal = total + newMoney;

  // ── Paso 1: necesidad ideal de cada activo (solo positivo = solo compra) ──
  const results = rows.map((row, i) => {
    const val      = getRowValue(row);
    const price    = parseFloat(row.price)  || 0;
    const tgt      = (parseFloat(row.target) || 0) / 100;
    const targetVal = newTotal * tgt;
    const idealBuy  = Math.max(0, targetVal - val);
    return { row, val, targetVal, price, idealBuy, allocated: 0, color: PALETTE[i % PALETTE.length] };
  });

  // ── Paso 2: escalar al presupuesto disponible ──
  const totalWanted = results.reduce((s, r) => s + r.idealBuy, 0);
  const scale = totalWanted > 0 ? Math.min(1, newMoney / totalWanted) : 0;
  results.forEach(r => { r.allocated = r.idealBuy * scale; });

  // ── Paso 3: calcular unidades enteras y gasto real ──
  results.forEach(r => {
    if (r.price > 0) {
      r.units = Math.floor(r.allocated / r.price);
      r.spent = r.units * r.price;
    } else {
      r.units = null;
      r.spent = r.allocated;
    }
  });

  const totalSpent   = results.reduce((s, r) => s + r.spent, 0);
  const sinAsignar   = newMoney - totalSpent;

  let html = `
    <div class="alert alert-info" style="margin-bottom:16px;">
      Cartera actual: <strong>${fmt(total)} €</strong> &nbsp;|&nbsp;
      Aportación: <strong>${fmt(newMoney)} €</strong> &nbsp;|&nbsp;
      Total estimado: <strong>${fmt(total + totalSpent)} €</strong>
      ${eurUsd ? `&nbsp;|&nbsp; <span style="font-size:12px;opacity:0.8">1 € = ${eurUsd.toFixed(4)} $</span>` : ''}
    </div>
    <div class="table-wrap">
      <table class="result-table">
        <thead>
          <tr>
            <th>Activo</th>
            <th style="text-align:right">Valor actual (€)</th>
            <th style="text-align:right">Valor objetivo (€)</th>
            <th style="text-align:right">Asignación (€)</th>
            <th style="text-align:right">Unidades</th>
          </tr>
        </thead>
        <tbody>
  `;

  results.forEach(({ row, val, targetVal, price, allocated, units, spent, color }) => {
    const tickerHtml = row.ticker
      ? `<span style="font-family:'Courier New',monospace;font-size:11px;font-weight:700;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 6px;color:var(--muted)">${esc(row.ticker.toUpperCase())}</span>`
      : '<span style="color:var(--border)">—</span>';

    let investHtml;
    if (allocated < 0.5) {
      investHtml = '<span class="muted">—</span>';
    } else {
      const usdPart = eurUsd ? `<br><span style="color:var(--muted);font-size:11px">~${fmtDec(allocated * eurUsd)} $</span>` : '';
      investHtml = `<span class="green" style="font-weight:600">+${fmtDec(allocated)} €</span>${usdPart}`;
    }

    // Unidades: 0 = no llega a 1, null = sin precio
    let unitsHtml;
    if (units === null) {
      unitsHtml = `<span class="muted" style="font-size:11px">—</span>`;
    } else if (units === 0) {
      unitsHtml = `<span style="color:var(--yellow);font-size:11px" title="Asignación insuficiente para 1 unidad (precio: ${fmtDec(price)} €)">< 1 ud.</span>`;
    } else {
      unitsHtml = `<span class="green" style="font-weight:700">+${units} ud.</span>`;
    }

    html += `
      <tr>
        <td data-label="Activo">
          <div style="display:flex;align-items:center;gap:8px;">
            ${tickerHtml}
            <div style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;"></div>
            ${esc(row.name || '—')}
          </div>
        </td>
        <td class="num" style="text-align:right" data-label="Valor actual">${fmt(val)} €</td>
        <td class="num" style="text-align:right" data-label="Valor objetivo">${fmt(targetVal)} €</td>
        <td style="text-align:right" data-label="Asignación">${investHtml}</td>
        <td style="text-align:right" data-label="Unidades">${unitsHtml}</td>
      </tr>
    `;
  });

  const footNote = sinAsignar > 0.5
    ? `&nbsp;|&nbsp; Sin usar (redondeo): <strong style="color:var(--yellow)">${fmtDec(sinAsignar)} €</strong>`
    : '';

  html += `
        </tbody>
        <tfoot>
          <tr style="border-top:1px solid var(--border)">
            <td colspan="5" style="padding:10px 12px;color:var(--muted);font-size:12px;">
              Total a comprar: <strong style="color:var(--green)">${fmt(totalSpent)} €</strong>${footNote}
            </td>
          </tr>
        </tfoot>
      </table>
    </div>
  `;

  container.innerHTML = html;
}

// ── Gráficos ──
function drawCharts() {
  drawPie();
  drawBar();
}

function drawPie() {
  const canvas = document.getElementById('pie-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const total = getTotal();
  const legend = document.getElementById('pie-legend');

  if (total === 0 || rows.length === 0) {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#2e3350';
    ctx.beginPath();
    ctx.arc(W/2, H/2, 100, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#7a7f99';
    ctx.font = '13px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Sin datos', W/2, H/2 + 5);
    legend.innerHTML = '';
    return;
  }

  const cx = W / 2, cy = H / 2, r = 100, innerR = 55;
  let angle = -Math.PI / 2;

  const slices = rows.map((row, i) => {
    const val = getRowValue(row);
    const pct = val / total;
    return { row, val, pct, color: PALETTE[i % PALETTE.length] };
  }).filter(s => s.val > 0);

  slices.forEach(s => {
    const sweep = s.pct * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, angle, angle + sweep);
    ctx.closePath();
    ctx.fillStyle = s.color;
    ctx.fill();
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0f1117';
    ctx.lineWidth = 2;
    ctx.stroke();
    angle += sweep;
  });

  // Donut hole
  ctx.beginPath();
  ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || '#1a1d27';
  ctx.fill();

  // Centro: total
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#e8eaf0';
  ctx.font = 'bold 14px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(fmt(total) + ' €', cx, cy + 5);

  // Leyenda
  legend.innerHTML = slices.map(s => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${s.color}"></div>
      <span>${esc(s.row.name || '—')} <span style="color:var(--muted)">${(s.pct*100).toFixed(1)}%</span></span>
    </div>
  `).join('');
}

function drawBar() {
  const canvas = document.getElementById('bar-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  if (rows.length === 0) return;

  const total = getTotal();
  const pad = { top: 16, right: 16, bottom: 60, left: 36 };
  const chartW = W - pad.left - pad.right;
  const chartH = H - pad.top - pad.bottom;

  // Calcular máximo
  const maxPct = Math.max(
    ...rows.map(r => Math.max(
      total > 0 ? (getRowValue(r) / total * 100) : 0,
      parseFloat(r.target) || 0
    )), 5
  );

  const n = rows.length;
  const groupW = chartW / n;
  const barW = Math.min(groupW * 0.35, 28);
  const gap = 4;

  // Líneas de guía
  const cssBorder = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#2e3350';
  const cssMuted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#7a7f99';
  ctx.strokeStyle = cssBorder;
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + chartH - (i / 4) * chartH;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + chartW, y); ctx.stroke();
    ctx.fillStyle = cssMuted;
    ctx.font = '10px Segoe UI, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText((maxPct * i / 4).toFixed(0) + '%', pad.left - 4, y + 3);
  }

  rows.forEach((row, i) => {
    const val = getRowValue(row);
    const act = total > 0 ? (val / total * 100) : 0;
    const tgt = parseFloat(row.target) || 0;
    const color = PALETTE[i % PALETTE.length];

    const x = pad.left + i * groupW + groupW / 2;
    const xAct = x - barW / 2 - gap / 2;
    const xTgt = x + gap / 2;

    // Barra actual
    const hAct = (act / maxPct) * chartH;
    ctx.fillStyle = color;
    ctx.fillRect(xAct, pad.top + chartH - hAct, barW, hAct);

    // Barra objetivo (semitransparente)
    const hTgt = (tgt / maxPct) * chartH;
    ctx.fillStyle = color + '66';
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.fillRect(xTgt, pad.top + chartH - hTgt, barW, hTgt);
    ctx.strokeRect(xTgt, pad.top + chartH - hTgt, barW, hTgt);

    // Etiqueta
    const label = (row.name || '—').slice(0, 9);
    ctx.fillStyle = cssMuted;
    ctx.font = '10px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.save();
    ctx.translate(x, pad.top + chartH + 8);
    ctx.rotate(-Math.PI / 5);
    ctx.fillText(label, 0, 0);
    ctx.restore();
  });

  // Leyenda del gráfico
  const ly = H - 8;
  const cssAccent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#5b7cf6';
  ctx.fillStyle = cssAccent;
  ctx.fillRect(pad.left, ly - 8, 12, 8);
  ctx.fillStyle = cssMuted;
  ctx.font = '10px Segoe UI, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Actual', pad.left + 16, ly);

  ctx.fillStyle = cssAccent + '66';
  ctx.strokeStyle = cssAccent;
  ctx.lineWidth = 1;
  ctx.fillRect(pad.left + 70, ly - 8, 12, 8);
  ctx.strokeRect(pad.left + 70, ly - 8, 12, 8);
  ctx.fillStyle = cssMuted;
  ctx.fillText('Objetivo', pad.left + 86, ly);
}

// ── Utilidades ──
function fmt(n) {
  return new Intl.NumberFormat('es-ES', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n);
}

function fmtDec(n) {
  return new Intl.NumberFormat('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
}

// ── Canvas responsivo ──
let resizeTimer;
function resizeCharts() {
  const pie = document.getElementById('pie-canvas');
  const bar = document.getElementById('bar-canvas');
  if (!pie || !bar) return;

  const pieW = Math.min(260, pie.parentElement.offsetWidth - 16);
  pie.width  = pieW;
  pie.height = pieW;

  const barW = Math.min(380, bar.parentElement.offsetWidth - 16);
  bar.width  = barW;
  bar.height = Math.round(barW * 0.68);

  drawCharts();
}

window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resizeCharts, 150);
});

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
